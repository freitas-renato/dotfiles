
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# autogenerated = 1 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

env = XMODIFIERS, @im=none
env = GTK_IM_MODULE, wayland
env = QT_IM_MODULE, wayland

env = GTK_IM_MODULE,cedilla
env = QT_IM_MODULE,cedilla

# NOTE: WLR_NO_HARDWARE_CURSORS is a no-op on Hyprland's aquamarine backend.
# Use cursor:no_hardware_cursors below instead. Kept commented for reference.
# env = WLR_NO_HARDWARE_CURSORS,1

# --- Multi-GPU: force NVIDIA dGPU as the PRIMARY renderer ---
# The 4K@144 monitor hangs off the NVIDIA GPU (pci 01:00.0). Listing it first
# makes Hyprland render natively on NVIDIA instead of rendering on the Intel
# iGPU and copying every frame across (the cause of cursor lag + workspace stutter).
# NOTE: aquamarine splits this list on ':', and by-path names contain colons
# (pci-0000:01:00.0), which breaks parsing and crashes startup. So we must use
# the colon-free /dev/dri/cardN paths. On this machine: card2=NVIDIA, card1=Intel
# (stable PCI enumeration order). NVIDIA listed first = primary renderer.
env = AQ_DRM_DEVICES,/dev/dri/card2:/dev/dri/card1

# --- Internal panel (eDP-1) is on the Intel iGPU; NVIDIA is the primary renderer ---
# With NVIDIA primary, eDP-1's frames are rendered on NVIDIA and must be scanned out
# by Intel. NVIDIA allocates block-linear TILED buffers, which the Intel display engine
# cannot import ("drmModeAddFB2WithModifiers failed / Buffer failed to import to KMS /
# crtc failed restore") -> the internal panel modesets OK but stays black after a
# lid-close/re-enable cycle. This forces ONLY the multi-GPU copy buffer (the one handed
# to Intel for eDP-1) to be LINEAR, which Intel can scan out, while leaving the NVIDIA
# 4K native path fully tiled/compressed. Requires a session restart to take effect.
# (If eDP-1 is still black after this, escalate to: env = AQ_NO_MODIFIERS,1)
env = AQ_FORCE_LINEAR_BLIT,1

# --- NVIDIA on Wayland (appropriate now that NVIDIA is the primary GPU) ---
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct

# debug:disable_logs = false

# FPS / frametime overlay drawn per-monitor (top-left). Toggle off when done.
debug {
    overlay = false
}

# Let Hyprland use hardware cursor planes (works once the 4K display is
# rendered natively on NVIDIA). 0=use HW cursors, 1=disable, 2=auto.
cursor {
    no_hardware_cursors = 0
}

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,1

# Lid switch handling -> scripts/lid.sh (see that script for the full rationale).
# Closing the lid does NOT disable eDP-1 by itself on this machine: the connector stays
# "connected/enabled" and Hyprland keeps rendering to it, so focus/windows can land on a
# panel whose backlight the EC has cut. We therefore disable it explicitly on close.
# switch:on = lid closed, switch:off = lid opened. `bindl` so it fires even while locked.
bindl = , switch:on:Lid Switch,  exec, /home/renato/.config/hypr/scripts/lid.sh close
bindl = , switch:off:Lid Switch, exec, /home/renato/.config/hypr/scripts/lid.sh open

# Configure integrated monitor resolution
monitor=eDP-1,1920x1080@144Hz,auto,1

# Gigabyte M32U 4K display.
# Driven over USB-C DisplayPort-Alt-Mode (connector DP-3) instead of HDMI.
# Starting at a safe 4K@120; once confirmed stable, bump to @143.99 — verify the
# USB-C link actually carries it by watching the FPS overlay (no black-screen).
#monitor=eDP-1,disable
monitor=DP-3,3840x2160@119.99Hz,auto,1.33
# HDMI fallback: if USB-C DP doesn't light up, comment the DP-3 line above and
# uncomment this one (then plug the cable back into HDMI).
#monitor=HDMI-A-5,3840x2160@143.99Hz,auto,1.5
monitor=HDMI-A-5,disable
#monitor=HDMI-A-1,1920x1080@60,auto,1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
# Command palette: the drun app list plus extra commands (clipboard history,
# and whatever else gets added to COMMANDS in the script). Runs wofi in dmenu
# mode because drun builds its list internally and can't be extended.
$menu = /home/renato/.local/bin/wofi-launcher


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
exec-once = waybar &
exec-once = hyprpaper &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# Clipboard history feed. cliphist only records what these watchers hand it,
# so without them $mainMod+C opens an empty list.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Idle handling: lock after 15 min, displays off after 45, lock before sleep.
exec-once = /home/renato/.local/bin/idle-daemon
exec-once = sleep 2 && python3 /home/renato/.config/hypr/switch_layout.py > /tmp/layout_script.log
# exec-once = sleep 1 && hyprctl dispatch dpms off && sleep 1 && hyprctl dispatch dpms on

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_THEME,MacOS-Tahoe-Cursor
env = XCURSOR_SIZE,32
#env = HYPRCURSOR_THEME,macOS
#env = HYPRCURSOR_SIZE,24


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general { 
    # Slightly wider than the old 5/8 so the window shadows have room to fall
    # off; at gaps_in=5 an 18px shadow bleeds into the neighbouring tile and
    # reads as smudge rather than depth.
    gaps_in = 6
    # top, right, bottom, left. The top is 8 rather than 12 to match waybar's
    # own 8px top margin (see waybar layouts/with_window.jsonc), so the gap
    # above the bar and the gap below it are equal. The gap is measured from
    # waybar's reserved zone, so it stays correct if the bar height changes.
    gaps_out = 8, 12, 12, 12

    # macOS-style hairline instead of a coloured border. Focus is carried by
    # the shadow depth and dim_inactive (see the decoration block), which is
    # how macOS does it -- it has no accent border at all.
    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(ffffff40)
    col.inactive_border = rgba(ffffff12)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false 

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12

    # The macOS corner shape. A normal rounded rect (rounding_power = 2) uses a
    # circular arc, which meets the straight edge with a visible kink. Apple
    # uses continuous curvature -- a squircle -- so the curve eases in. This is
    # the single setting that most makes the corners "feel" like macOS.
    rounding_power = 4.0

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    # Unfocused windows recede by darkening rather than going translucent:
    # dim keeps text legible, where inactive_opacity would let the wallpaper
    # show through. This also lets the 1px border stay minimal, since focus no
    # longer has to be signalled by the border alone.
    dim_inactive = true
    dim_strength = 0.2

    # Depth instead of colour: a large soft shadow, offset slightly downward
    # like a real light source, and weaker when the window is unfocused.
    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0 4
        color = rgba(00000055)
        color_inactive = rgba(00000028)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1
        
        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 3, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vrr = 0   # 0=off, 1=on, 2=fullscreen only
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us, us
    kb_variant =  , intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.7
    }
}


# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = at-translated-set-2-keyboard
    kb_options = ctrl:swapcaps
}

device {
    name = ite-tech.-inc.-ite-device(8176)-keyboard
    kb_options = ctrl:swapcaps
}

device {
    name = asuf1202:00-2808:0216-touchpad
    sensitivity = 0.25
}


####################
### KEYBINDINGSS ###
####################

# See https://wiki.hyprland.org/Configuring/Keywords/
# $mainMod = SUPER # Sets "Windows" key as main modifier
$mainMod = ALT # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, T, exec, $terminal
bind = $mainMod SHIFT, Q, killactive,
bind = $mainMod SHIFT, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, C, exec, /home/renato/.local/bin/wofi-clipboard
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, R, exec, hyprctl reload

# Move focus to last focused workspace
bind = $mainMod, D, workspace, previous

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + vim arrows
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d


# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screen lock. Goes through scripts/lock rather than the locker directly so the
# keybind, the swaync button and swayidle all share one entry point (and cannot
# stack two lockers). hyprlock was replaced here because it froze constantly.
bind = $mainMod SHIFT, L, exec, /home/renato/.local/bin/lock

# Enable passthrough mode 
bind = $mainMod SHIFT, P, submap, passthrough
bind = $mainMod SHIFT, P, exec, notify-send "Keyboard Passthrough Enabled"

submap = passthrough
bind = $mainMod SHIFT, P, submap, reset
bind = $mainMod SHIFT, P, exec, notify-send "Keyboard Passthrough Disabled"
submap = reset

bind = $mainMod, F7, exec, /home/renato/.config/hypr/scripts/toggle-internal-monitor.sh



##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

bind = $mainMod, F, fullscreen

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

# screenshot 
bind = $mainMod SHIFT, O, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > ~/Pictures/Screenshots/Screenshot-$(date +%F_%T).png
source = ./openwhispr-binds.conf
