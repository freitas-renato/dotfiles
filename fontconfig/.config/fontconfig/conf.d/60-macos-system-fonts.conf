<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  macOS system-font mapping.

  Scope on purpose: this file ONLY redirects the *generic* families and the
  macOS "system font" tokens. Fonts requested by explicit name (kitty's
  "Cartograph CF", waybar's "CaskaydiaCove Nerd Font Propo", wofi's "Roboto",
  etc.) are deliberately left alone, so per-app font choices keep working.

  macOS mapping being reproduced:
    UI / sans-serif  -> SF Pro Text   (SF Pro Display at 20pt and above)
    serif            -> New York
    monospace        -> SF Mono

  TWO NON-OBVIOUS THINGS, both easy to get wrong:

   1. mode="prepend", NOT "prepend_first". In fontconfig, "prepend" inserts the
      value immediately before the family element that matched the test, while
      "prepend_first" inserts at the head of the whole family list. For a CSS
      list like `font-family: Inter, system-ui`, prepend_first would put SF Pro
      Text ahead of Inter and hijack the app's own first choice. "prepend"
      leaves Inter first and only supplies SF when Inter is missing.

   2. The optical-size rule must come BEFORE the sans-serif alias below. Both
      insert relative to the "sans-serif" element, so whichever runs first ends
      up closer to the front. Running the size rule first yields
      [SF Pro Display, SF Pro Text, ..., sans-serif] and Display correctly wins
      at >=20pt; reverse them and SF Pro Text always wins.

  Verifying changes: `fc-match` treats "-" as the size separator, so
  `fc-match ui-monospace` silently queries family "ui" and tells you nothing.
  Always test with the explicit form:
      fc-match ':family=ui-monospace'
      fc-match ':family=sans-serif:size=20'
      fc-match ':family=Cartograph CF:family=ui-monospace'   # app font must win
-->
<fontconfig>

  <!-- The Apple fonts deliberately live OUTSIDE ~/.local/share/fonts, because
       that path is a GNU stow symlink into the dotfiles git repo (which has a
       public GitHub remote). Apple's license forbids redistributing these
       fonts, and half a gig of binaries has no business in that repo either. -->
  <dir>~/.local/share/apple-fonts</dir>

  <!-- ===== Optical sizing, the way macOS does it =====
       Apple uses SF Pro Text below 20pt and SF Pro Display at 20pt and up.
       Must stay BEFORE the sans-serif alias below (see header note 2). -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <test name="size" compare="more_eq"><double>20</double></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Display</string></edit>
  </match>

  <!-- ===== Generic family defaults ===== -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Pro</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>New York</family>
    </prefer>
  </alias>

  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
    </prefer>
  </alias>

  <!-- ===== "Use the platform UI font" tokens =====
       system-ui / ui-* are CSS and GTK4; -apple-system, BlinkMacSystemFont and
       .AppleSystemUIFont turn up in Electron apps and web content. They all
       literally mean "whatever the system font is", so pointing them at SF is
       reproducing macOS, not overriding an app's font choice. -->
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ui-sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>-apple-system</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>.AppleSystemUIFont</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>SF Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>ui-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>New York</string></edit>
  </match>


  <!-- ===== Rendering, scoped to the Apple faces only =====
       SF is designed against macOS's unhinted rasteriser. With hintstyle=slight
       the stems get snapped to the pixel grid and the letterforms visibly
       distort at UI sizes, the usual reason SF "looks wrong" on Linux.
       Disable hinting for these families only, so other fonts (notably the
       terminal's Cartograph CF) keep the global hintslight. Safe here because
       both displays are HiDPI (~140 dpi), where hinting buys little. -->
  <match target="font">
    <test name="family" compare="contains"><string>SF </string></test>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
  </match>
  <match target="font">
    <test name="family" compare="contains"><string>New York</string></test>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
  </match>

  <!--
    OPTIONAL, macOS-authentic text rendering.
    macOS applies no hinting and grayscale (not subpixel) antialiasing, which
    gives the softer, heavier Apple look. Your antialiasing is already
    grayscale; hinting is currently "slight". Uncomment to go full macOS.
    Note this affects ALL fonts, including your terminal, so it is left off.

  <match target="font">
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
  -->

</fontconfig>
