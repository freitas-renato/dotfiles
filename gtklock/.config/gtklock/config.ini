# gtklock, replacing hyprlock (which froze constantly on this hybrid-GPU box).
#
# gtklock is chosen over plain swaylock as the primary locker because it can
# reproduce what hyprlock actually gave us: a large clock, a date line and a
# styled input form. swaylock has none of those, and swaylock-effects (the fork
# that does) is not packaged for Ubuntu 26.04. swaylock is still configured in
# ../swaylock/config as a minimal fallback.
#
# glib key file format; every option must sit under [main].
# CLI equivalents are the same names, e.g. --time-format.

[main]

style=/home/renato/.config/gtklock/style.css
# Custom layout: built-in one minus the "Password:" label. See layout.xml.
layout=/home/renato/.config/gtklock/layout.xml
background=/home/renato/Pictures/wallpaper.jpeg

# date(1) format strings. Mirrors the old hyprlock labels.
time-format=%H:%M
date-format=%A, %B %d

# The man page explicitly recommends this for Hyprland: it moves the input form
# to whichever monitor has focus instead of pinning it to one output. Matters
# here because of the laptop panel + external 4K setup.
follow-focus=true

# macOS-like behaviour: after a few idle seconds the form fades out and leaves
# just the clock over the wallpaper; typing brings it back.
idle-hide=true
idle-timeout=10
